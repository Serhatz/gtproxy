[package]
name = "gtproxy"
version = "0.1.0"
edition = "2024"
description = "Growtopia MITM proxy: client <-> proxy <-> server"

[dependencies]
anyhow = "1"
bitflags = "2"
rusty_enet = { git = "https://github.com/CLOEI/rusty_enet" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# HTTPS server for server_data.php (ring backend, no aws-lc / cmake needed on Windows)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Upstream HTTPS client (lets us pin a host to the real IP, bypassing our own hosts entries)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rcgen = "0.13"
# Window handle for embedded mode (same version eframe uses).
raw-window-handle = "0.6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard"] }

# Standalone crate; keeps the parent GrowBots workspace from claiming it.
[workspace]
